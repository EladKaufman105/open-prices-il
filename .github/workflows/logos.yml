name: Fetch logos

on:
  workflow_dispatch:
  push:
    paths:
      - "pipeline/fetch_logos.py"
      - ".github/workflows/logos.yml"

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python pipeline/fetch_logos.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add logos/
          git commit -m "Logo candidates" || exit 0
          git pull --rebase -q && git push
