name: Build app

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            echo "Signing with the release key"
          else
            echo "::warning::KEYSTORE_B64 secret not set - APK is signed with a temporary debug key"
          fi
      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: openprices
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p build-logs
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -150 > build-logs/last-failure.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add build-logs/ && git commit -m "Build failure log" && git pull --rebase -q && git push || true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "mechiron-${{ github.run_number }}.apk"
          gh release create "app-v${{ github.run_number }}" "mechiron-${{ github.run_number }}.apk" \
            --title "מחירון – גרסה ${{ github.run_number }}" \
            --notes "בנייה אוטומטית מ-${GITHUB_SHA::7}" --latest
